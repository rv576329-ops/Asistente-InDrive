name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Asistente_InDrive_Soyapango_Android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o Asistente_InDrive_Soyapango_Android.zip -d proyecto
          find proyecto -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd proyecto
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Asistente-InDrive-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
